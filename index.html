<style>
/* ===================================================================
   My Creator Desk — design tokens
   Paper and ink for the working surface, a deep bottle-green desk
   (sidebar) and marigold for money and the one thing that matters on
   each screen. Teal is the brand action colour.
   =================================================================== */
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --sunk:#E9EFED; --ink:#13201E; --muted:#56686A; --faint:#8A9A98; --line:#D6E0DD; --line-2:#C3D0CC;
  --teal:#0D6A65; --teal-ink:#FFFFFF; --teal-soft:#DCEEEA; --teal-deep:#0A4E4A;
  --desk:#0E2E2B; --desk-2:#14403C; --desk-ink:#E6F0EE; --desk-mut:#93B1AC;
  --gold:#E3A21A; --gold-soft:#FBEFD2; --gold-ink:#6B4A00;
  --good:#1E7845; --good-bg:#DFF1E5; --warn:#8F5B00; --warn-bg:#FAEED3; --bad:#B13529; --bad-bg:#F8E1DD;
  --f-display:"Familjen Grotesk","Helvetica Neue",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --shadow:0 1px 0 rgba(19,32,30,.04),0 8px 24px -12px rgba(19,32,30,.18);
  --side-w:252px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D1514; --surface:#141F1D; --sunk:#1A2826; --ink:#E4EDEB; --muted:#9AAEAA; --faint:#6F8580; --line:#263431; --line-2:#33443F;
  --teal:#4DBFB5; --teal-ink:#05211E; --teal-soft:#16332F; --teal-deep:#7AD3CA;
  --desk:#09130F; --desk-2:#12221F; --desk-ink:#DCEAE7; --desk-mut:#7E9893;
  --gold:#F2B93B; --gold-soft:#33280E; --gold-ink:#F6D58A;
  --good:#63C98B; --good-bg:#15301F; --warn:#E2B04D; --warn-bg:#33280E; --bad:#EF8175; --bad-bg:#3A1C18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D1514; --surface:#141F1D; --sunk:#1A2826; --ink:#E4EDEB; --muted:#9AAEAA; --faint:#6F8580; --line:#263431; --line-2:#33443F;
  --teal:#4DBFB5; --teal-ink:#05211E; --teal-soft:#16332F; --teal-deep:#7AD3CA;
  --desk:#09130F; --desk-2:#12221F; --desk-ink:#DCEAE7; --desk-mut:#7E9893;
  --gold:#F2B93B; --gold-soft:#33280E; --gold-ink:#F6D58A;
  --good:#63C98B; --good-bg:#15301F; --warn:#E2B04D; --warn-bg:#33280E; --bad:#EF8175; --bad-bg:#3A1C18;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

/* ---------- base ---------- */
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;font-feature-settings:"tnum" 0}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance;line-height:1.1}
h1{font-size:clamp(30px,4vw,42px);font-weight:700}
h2{font-size:24px;font-weight:600}
h3{font-size:18px;font-weight:600}
h4{font-size:15px;font-weight:600;letter-spacing:0}
p{margin:0}
a{color:var(--teal)}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13.5px} .tiny{font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:6px}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.spread{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* ---------- controls ---------- */
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:9px 15px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap;text-decoration:none;line-height:1.2;min-height:38px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--teal)}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.primary:hover{background:var(--teal-deep);border-color:var(--teal-deep)}
:root[data-theme="dark"] .btn.primary:hover{background:var(--teal);filter:brightness(1.1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary:hover{background:var(--teal);filter:brightness(1.1)}}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2A1D00;font-weight:600}
.btn.gold:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad)}
.btn.sm{padding:6px 11px;min-height:32px;font-size:13px}
.btn.lg{padding:12px 20px;min-height:46px;font-size:15.5px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.armed{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.x{border:none;background:transparent;color:var(--muted);font-size:18px;line-height:1;padding:6px 8px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-bg)}
.x.armed{color:var(--bad);background:var(--bad-bg);font-size:12px;font-weight:600}
.link{all:unset;cursor:pointer;color:var(--teal);font-weight:500;text-underline-offset:3px}
.link:hover{text-decoration:underline}
.link:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:3px}

label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
label.field .hint{font-weight:400;color:var(--faint);font-size:12.5px;margin-left:4px}
label.field>.lt{display:block}
input,select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-s);padding:9px 11px;width:100%;min-width:0;min-height:40px}
textarea{min-height:80px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:0;border-color:var(--teal)}
input[type=number]{font-variant-numeric:tabular-nums}
input[type=checkbox],input[type=radio]{width:17px;height:17px;min-height:0;accent-color:var(--teal);cursor:pointer;padding:0}
.form{display:grid;gap:12px;align-items:end}
.form.cols-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.form.cols-4{grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr))}
.form .full{grid-column:1/-1}
.form .btn{justify-self:start}

.seg{display:inline-flex;background:var(--sunk);border-radius:99px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ---------- surfaces ---------- */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel.tight{padding:16px;gap:12px}
.panel.flat{background:var(--sunk);border-color:transparent}
.empty{border:1px dashed var(--line-2);border-radius:var(--r-m);padding:32px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:18px;font-weight:600}
.empty .btn{margin-top:6px}
.note{display:flex;gap:10px 16px;flex-wrap:wrap;align-items:center;justify-content:space-between;border-radius:var(--r-m);padding:12px 16px;font-size:14px;background:var(--teal-soft)}
.note.warn{background:var(--warn-bg)}
.note.bad{background:var(--bad-bg)}
.note.gold{background:var(--gold-soft)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:99px;white-space:nowrap;line-height:1.6}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--sunk);color:var(--muted)} .chip.teal{background:var(--teal-soft);color:var(--teal)} .chip.gold{background:var(--gold-soft);color:var(--gold-ink)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.neutral{background:var(--faint)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,var(--sunk),var(--line),var(--sunk));background-size:200% 100%;animation:sk 1.4s ease infinite;border-radius:6px;min-height:14px}
@keyframes sk{to{background-position:-200% 0}}

/* stats + kpis: a ledger strip, hairline-divided */
.ledger{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.ledger>div{background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ledger .k{font-size:13px;color:var(--muted);font-weight:500}
.ledger .v{font-family:var(--f-display);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.ledger .s{font-size:12.5px;color:var(--muted)}
.boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px;align-items:stretch}
.box{background:var(--sunk);border-radius:var(--r-m);padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.box .k{font-size:13px;color:var(--muted);font-weight:500}
.box .v{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.box.hit{background:var(--warn-bg)}
.box.money{background:var(--gold-soft)}
.box.money .v{color:var(--gold-ink)}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
tbody tr:last-child td{border-bottom:none}
th{font-size:12.5px;font-weight:600;color:var(--muted);background:var(--sunk);position:sticky;top:0;z-index:1}
th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover td{background:color-mix(in srgb,var(--teal-soft) 35%,transparent)}
.sort{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
.sort:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sort .arr{font-size:10px;opacity:.35}
.sort.on{color:var(--teal)} .sort.on .arr{opacity:1}
td.hi{background:color-mix(in srgb,var(--gold-soft) 70%,transparent)!important}
.cname{font-weight:600;color:var(--ink);text-align:left}
button.cname{all:unset;cursor:pointer;font-weight:600}
button.cname:hover{color:var(--teal);text-decoration:underline;text-underline-offset:3px}
button.cname:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.csub{font-size:12px;color:var(--muted)}
.why{font-size:12.5px;color:var(--muted);margin-top:3px;white-space:normal;min-width:180px;max-width:260px;line-height:1.4}
.t-short{min-width:3300px}
.t-short .stick{position:sticky;left:0;z-index:2;background:var(--surface);box-shadow:1px 0 0 var(--line)}
.t-short th.stick{background:var(--sunk);z-index:3}
.t-short td.stick.hi{background:var(--gold-soft)!important}
.t-posts{min-width:1080px}
.cell-in{width:100px;padding:5px 8px;font-size:13.5px;text-align:right;min-height:32px}
.cell-in.fee{width:112px}
.lnk{color:var(--teal);text-decoration:none;font-weight:500}
.lnk:hover{text-decoration:underline}
.status-note{font-size:12px;color:var(--muted);white-space:normal;max-width:240px}

.track{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;position:relative}
.fill{height:100%;background:var(--teal);border-radius:99px;transition:width .4s}
.fill.over{background:var(--bad)} .fill.gold{background:var(--gold)}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}

/* charts */
svg text{font-family:var(--f-body);font-size:12px}
.t-ink{fill:var(--ink)} .t-mut{fill:var(--muted)}
.g-line{stroke:var(--line);stroke-width:1}
.m-line{stroke:var(--gold);stroke-width:2;stroke-dasharray:4 4}
.b-good{fill:var(--good)} .b-warn{fill:var(--warn)} .b-bad{fill:var(--bad)} .b-neutral{fill:var(--faint)} .b-teal{fill:var(--teal)} .b-gold{fill:var(--gold)} .b-sunk{fill:var(--line-2)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* insights */
.split{display:flex;gap:22px}.split>div{display:flex;flex-direction:column}.split strong{font-family:var(--f-display);font-size:21px}
.mix{display:flex;flex-direction:column;gap:7px}.mixrow{display:grid;grid-template-columns:100px 1fr;gap:2px 10px;align-items:center}.mixrow .muted{grid-column:2}
.bar{display:block;height:8px;background:var(--surface);border-radius:4px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--teal);border-radius:4px}
.drop{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;text-align:center;border:1.5px dashed var(--line-2);border-radius:var(--r-m);padding:28px 18px;cursor:pointer;background:var(--sunk);font-size:15px}
.drop:hover,.drop.over{border-color:var(--teal);background:var(--teal-soft)}
.drop strong{color:var(--teal)}
.drop:focus-within{outline:2px solid var(--teal);outline-offset:2px}
.summary{font-family:var(--f-body);font-size:14px;line-height:1.7;white-space:pre-wrap;background:var(--sunk);border-radius:var(--r-m);padding:16px 18px;margin:0;overflow-wrap:anywhere}
dl.formulas{margin:0;display:grid;grid-template-columns:auto 1fr;gap:9px 16px;font-size:14px}
dl.formulas dt{font-weight:600;white-space:nowrap}
dl.formulas dd{margin:0;color:var(--muted);font-size:13.5px;min-width:0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:20px;align-items:start}
.paste{font-size:13px;min-height:110px}

/* toast + dialog */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:11px 16px;border-radius:var(--r-m);font-size:14px;z-index:60;max-width:min(560px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);animation:tin .25s ease}
.toast.err{background:var(--bad);color:#fff}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}
dialog{border:none;border-radius:var(--r-l);padding:0;background:var(--surface);color:var(--ink);width:min(520px,calc(100% - 32px));max-height:calc(100% - 48px);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(9,19,17,.55)}
dialog .d-body{padding:24px;display:flex;flex-direction:column;gap:16px}
dialog .d-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:var(--sunk)}

/* ===================================================================
   Public pages
   =================================================================== */
.pub{min-height:100vh;display:flex;flex-direction:column}
.pub-nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid transparent;padding-top:env(safe-area-inset-top,0px)}
.pub-nav.scrolled{border-bottom-color:var(--line)}
.gut{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;width:100%}
.pub-nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.brand{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.brand .mk{width:30px;height:30px;flex:none}
.pub-nav nav{display:flex;align-items:center;gap:4px}
.pub-nav nav a.navl{color:var(--muted);text-decoration:none;font-weight:500;font-size:14.5px;padding:8px 12px;border-radius:6px}
.pub-nav nav a.navl:hover{color:var(--ink);background:var(--sunk)}
@media (max-width:640px){.pub-nav nav a.navl{display:none}}

.hero{padding-block:56px 72px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}
@media (max-width:920px){.hero .wrap{grid-template-columns:1fr;gap:40px}.hero{padding-block:32px 48px}}
.hero h1{font-size:clamp(40px,6vw,68px);line-height:.98;letter-spacing:-.035em;font-weight:700;max-width:12ch}
.hero .lede{font-size:18px;color:var(--muted);max-width:46ch;margin-top:22px;line-height:1.55}
.hero .btns{margin-top:30px;gap:12px}
.hero .fine{margin-top:16px;font-size:13.5px;color:var(--faint)}

/* the verdict slip: the one memorable object on the landing page */
.slip-wrap{position:relative;padding:18px 0 18px 18px}
.slip-wrap::before{content:"";position:absolute;inset:0 0 0 0;background:var(--desk);border-radius:22px;transform:rotate(-2.2deg);z-index:0}
.slip{position:relative;z-index:1;background:var(--surface);border-radius:14px;box-shadow:0 30px 60px -28px rgba(0,0,0,.45);padding:22px 22px 18px;display:flex;flex-direction:column;gap:16px;transform:rotate(1deg);animation:slip-in .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes slip-in{from{opacity:0;transform:rotate(4deg) translateY(28px)}}
.slip-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.slip .who{display:flex;gap:12px;align-items:center}
.slip .av{width:44px;height:44px;border-radius:50%;background:conic-gradient(from 200deg,#F2B93B,#E0566B,#7A4CE0,#F2B93B);padding:2.5px;flex:none}
.slip .av i{display:block;width:100%;height:100%;border-radius:50%;background:var(--teal-soft);border:2px solid var(--surface)}
.slip .h{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.01em}
.slip .verdict{font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--good);background:var(--good-bg);padding:6px 12px;border-radius:99px;white-space:nowrap}
.slip-nums{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.slip-nums div{padding:12px 0;display:flex;flex-direction:column}
.slip-nums div+div{padding-left:14px;border-left:1px solid var(--line)}
.slip-nums span{font-size:12.5px;color:var(--muted)}
.slip-nums b{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.slip-cpv{display:flex;flex-direction:column;gap:8px}
.slip-cpv .ln{display:grid;grid-template-columns:96px 1fr 58px;gap:10px;align-items:center;font-size:13px}
.slip-cpv .ln span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.slip-cpv .tr{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.slip-cpv .tr i{display:block;height:100%;border-radius:99px;animation:grow 1.1s .5s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}}
.slip-foot{display:flex;flex-wrap:wrap;gap:6px}
.stamp{position:absolute;right:-6px;bottom:-14px;z-index:2;background:var(--gold);color:#2A1D00;font-family:var(--f-display);font-weight:700;font-size:14px;padding:10px 14px;border-radius:12px;transform:rotate(-5deg);box-shadow:0 12px 24px -10px rgba(0,0,0,.4);animation:slip-in .9s .25s cubic-bezier(.2,.8,.2,1) both;line-height:1.25}
.stamp small{display:block;font-weight:500;font-size:12px;opacity:.8}

.band{padding-block:72px}
.band.desk{background:var(--desk);color:var(--desk-ink)}
.band.desk .muted{color:var(--desk-mut)}
.band h2{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.025em;max-width:22ch}
.band .intro{max-width:60ch;margin-top:12px;font-size:16.5px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:36px 40px;margin-top:44px}
.feat h3{font-size:19px;margin-bottom:8px}
.feat p{color:var(--desk-mut);font-size:15px}
.feat .ic{width:36px;height:36px;border-radius:9px;background:var(--desk-2);display:grid;place-items:center;margin-bottom:16px;color:var(--gold)}

.steps{list-style:none;margin:40px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:0;counter-reset:st;border-top:2px solid var(--ink)}
.steps li{counter-increment:st;padding:18px 18px 0 0;display:flex;flex-direction:column;gap:6px}
.steps li::before{content:counter(st);font-family:var(--f-display);font-weight:700;font-size:30px;color:var(--teal);line-height:1}
.steps strong{font-family:var(--f-display);font-size:16.5px}
.steps span{font-size:14px;color:var(--muted)}

.pricing{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;margin-top:36px;align-items:stretch}
.plan{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:26px;display:flex;flex-direction:column;gap:18px;position:relative}
.plan.pick{border:2px solid var(--teal);box-shadow:var(--shadow)}
.plan.sel{border:2px solid var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.plan .tag{position:absolute;top:-12px;left:24px;background:var(--teal);color:var(--teal-ink);font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px}
.plan h3{font-size:21px}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price b{font-family:var(--f-display);font-size:40px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.price span{color:var(--muted);font-size:14px}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px;font-size:14.5px}
.plan li{display:flex;gap:10px;align-items:flex-start}
.plan li svg{flex:none;margin-top:3px;color:var(--teal)}
.plan .btn{margin-top:auto}
.save{font-size:13px;color:var(--good);font-weight:600}

.pub-foot{border-top:1px solid var(--line);padding-block:28px;font-size:14px;color:var(--muted);margin-top:auto}
.pub-foot .wrap{display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between}
.pub-foot a{color:var(--muted)}

/* sign-in and setup screens: one calm card in the middle */
.center{flex:1;display:grid;place-items:center;padding:32px 20px 64px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);padding:34px 30px;width:100%;max-width:460px;display:flex;flex-direction:column;gap:18px;box-shadow:var(--shadow)}
.card.wide{max-width:640px}
.card.xwide{max-width:1040px;background:transparent;border:none;box-shadow:none;padding:0}
.g-btn{gap:12px;padding:12px 20px;font-size:15.5px;border-radius:99px;background:#fff;color:#1f1f1f;border:1px solid #dadce0;min-height:48px;font-weight:500;width:100%}
.g-btn:hover{border-color:#a8c7fa;background:#f8fafd}
.progress-steps{display:flex;gap:6px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
.progress-steps li{flex:1;display:flex;flex-direction:column;gap:6px}
.progress-steps li::before{content:"";height:4px;border-radius:99px;background:var(--line)}
.progress-steps li.done::before{background:var(--teal)}
.progress-steps li.now{color:var(--ink);font-weight:600}
.progress-steps li.now::before{background:var(--gold)}
.checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.checklist li{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.checklist .ck{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--sunk);color:var(--muted)}
.checklist li.done .ck{background:var(--good-bg);color:var(--good)}
.checklist li.now .ck{background:var(--gold-soft);color:var(--gold-ink)}
.pulse{width:72px;height:72px;border-radius:50%;background:var(--gold-soft);display:grid;place-items:center;position:relative;color:var(--gold-ink)}
.pulse::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--gold);opacity:.45;animation:pl 2.4s ease-out infinite}
@keyframes pl{from{transform:scale(.85);opacity:.6}to{transform:scale(1.25);opacity:0}}

/* preview personas */
.persona{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-m);padding:12px 14px;width:100%}
.persona:hover{border-color:var(--teal);background:var(--teal-soft)}
.persona .pi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-family:var(--f-display);background:var(--sunk);color:var(--teal)}
.persona b{display:block;font-size:15px}
.persona span{font-size:13px;color:var(--muted)}

/* ===================================================================
   The desk (signed-in app)
   =================================================================== */
.desk-app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);min-height:100vh;background:linear-gradient(to right,var(--desk) var(--side-w),transparent 0)}
td .track{min-width:110px}
.side{background:var(--desk);color:var(--desk-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px calc(14px + env(safe-area-inset-bottom,0px));gap:18px;overflow-y:auto;scrollbar-width:thin}
.side .brand{color:var(--desk-ink);padding:2px 8px}
.co-switch{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:34px 1fr 16px;gap:10px;align-items:center;background:var(--desk-2);border-radius:var(--r-m);padding:10px 12px;width:100%}
.co-switch:hover{filter:brightness(1.12)}
.co-switch:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.co-switch .co-mark{width:34px;height:34px;border-radius:8px;background:var(--gold);color:#2A1D00;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.co-switch b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.co-switch span{display:block;font-size:12.5px;color:var(--desk-mut)}
.side nav{display:flex;flex-direction:column;gap:2px}
.side .grp{font-size:12.5px;color:var(--desk-mut);padding:14px 10px 6px;font-weight:500}
.side a.nl{display:flex;align-items:center;gap:11px;color:var(--desk-ink);text-decoration:none;padding:9px 10px;border-radius:8px;font-size:14.5px;font-weight:500;opacity:.88}
.side a.nl svg{flex:none;opacity:.75}
.side a.nl:hover{background:var(--desk-2);opacity:1}
.side a.nl[aria-current="page"]{background:var(--desk-2);opacity:1;box-shadow:inset 3px 0 0 var(--gold)}
.side a.nl[aria-current="page"] svg{opacity:1;color:var(--gold)}
.side a.nl .cnt{margin-left:auto;font-size:12px;background:rgba(255,255,255,.08);padding:0 8px;border-radius:99px;font-variant-numeric:tabular-nums}
.side a.nl .cnt.gold{background:var(--gold);color:#2A1D00;font-weight:600}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.cap{background:var(--desk-2);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.cap .track{background:rgba(255,255,255,.08);height:6px}
.cap .fill{background:var(--gold)}
.cap span{color:var(--desk-mut)}
.me{display:grid;grid-template-columns:32px 1fr auto;gap:10px;align-items:center;padding:4px 6px}
.me img,.me .av{width:32px;height:32px;border-radius:50%;background:var(--desk-2);display:grid;place-items:center;font-weight:600;font-size:13px;color:var(--gold)}
.me b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.me span{display:block;font-size:12px;color:var(--desk-mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me button{border:0;background:transparent;color:var(--desk-mut);padding:6px;border-radius:6px}
.me button:hover{color:var(--desk-ink);background:var(--desk-2)}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:20px 32px 0;padding-top:max(20px,env(safe-area-inset-top,0px))}
.topbar .menu{display:none}
.page{padding:20px 32px 72px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.page-head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between}
.page-head .stack{gap:6px}
.page-head p{max-width:68ch}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.sec-head p{max-width:72ch}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;gap:8px;align-items:center;margin-bottom:-1px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold);font-weight:600}
.tabs button:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.tabs .count{font-size:12px;background:var(--sunk);color:var(--muted);padding:0 8px;border-radius:99px}

.handle-big{font-family:var(--f-display);font-size:30px;font-weight:600;overflow-wrap:anywhere;letter-spacing:-.02em;line-height:1.1}
.lookup-bar{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:12px;align-items:end}
@media (max-width:640px){.lookup-bar{grid-template-columns:1fr}}

.co-menu{position:absolute;z-index:40;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-m);box-shadow:0 20px 50px rgba(0,0,0,.3);padding:6px;min-width:250px;display:flex;flex-direction:column}
.co-menu button,.co-menu a{all:unset;cursor:pointer;padding:9px 12px;border-radius:7px;font-size:14px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.co-menu button:hover,.co-menu a:hover,.co-menu button:focus-visible{background:var(--sunk)}
.co-menu hr{border:0;border-top:1px solid var(--line);margin:5px 0}

.scrim{display:none}
@media (max-width:920px){
  .desk-app{grid-template-columns:1fr;background:none}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:50;transform:translateX(-102%);transition:transform .25s ease;box-shadow:20px 0 60px rgba(0,0,0,.3)}
  .desk-app.open .side{transform:none}
  .desk-app.open .scrim{display:block;position:fixed;inset:0;background:rgba(9,19,17,.5);z-index:45}
  .topbar{padding:12px 16px 0;padding-top:max(12px,env(safe-area-inset-top,0px));position:sticky;top:0;z-index:30;background:var(--paper);padding-bottom:10px;border-bottom:1px solid var(--line)}
  .topbar .menu{display:inline-flex}
  .page{padding:18px 16px 64px}
}
@media print{.side,.topbar{display:none}}
</style>
</head>
<body>
<div id="root" aria-live="polite"></div>
<div class="toast" id="toast" hidden role="status"></div>
<datalist id="cat-list"></datalist><datalist id="lang-list"></datalist><datalist id="handles"></datalist>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/preview.js"></script>
<script src="js/app.js"></script>
<script src="js/work.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
