# Supabase project settings used by `supabase functions deploy` and `supabase db push`.
project_id = "my-creator-desk"

# Both functions check sign-in themselves (api: Supabase sign-in token; webhook: Razorpay signature),
# which works with Supabase's new signing keys.
[functions.api]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[auth]
site_url = "https://mycreatordesk.co.in"
additional_redirect_urls = ["https://mycreatordesk.co.in/", "https://www.mycreatordesk.co.in/"]

[auth.external.google]
enabled = true
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
skip_nonce_check = false
